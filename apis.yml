    type: SourceCode
  description: >-
    Phind's genuinely public developer artifacts - open-weight models published
    to the Phind organization on Hugging Face. These include the code models
    Phind-CodeLlama-34B-v1, Phind-CodeLlama-34B-v2, and
    Phind-CodeLlama-34B-Python-v1 (fine-tunes of Meta's Code Llama 34B,
    released August 2023 and briefly the top-ranked open-source coding models on
    HumanEval), plus the later Phind-70B, Phind-SVG, and Magic-Edit. These are
    downloadable model weights hosted on Hugging Face, not a hosted HTTP
    inference API operated by Phind; they can be self-hosted or run through
    third-party inference stacks. Listed as endpointsModeled because Phind
    exposed no official hosted inference endpoint for them.
