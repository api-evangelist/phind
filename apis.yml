name: Phind
kind: company
description: >-
  Phind was an AI answer engine and coding assistant built for developers,
  offering conversational, multi-step technical search on the web and through a
  VS Code extension. Founded in 2022 by Michael Royzen and Justin Wei (Y
  Combinator S22), Phind trained its own code models and briefly held the
  top-ranked open-source coding model on Hugging Face. The phind.com product was
  a consumer/subscription service and never shipped an official public or
  partner developer API - the only genuinely public developer artifacts were its
  open-weight models on Hugging Face (Phind-CodeLlama-34B v1/v2, Python-v1, and
  later Phind-70B). Community "Phind API" projects on GitHub and RapidAPI are
  unofficial reverse-engineered wrappers, not an official interface. Phind shut
  down on January 16, 2026; Pro subscribers received prorated refunds and could
  export chat history through January 30, 2026 before servers were wiped. This
  entry is a historical record; API surfaces are modeled, not officially
  documented.
