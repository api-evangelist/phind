actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket surface exists, and Phind never shipped any official public
    developer API. The apis.yml entry models two discovery surfaces - the AI
    answer engine and the Hugging Face open-weight models - both flagged
    endpointsModeled, with descriptions stating plainly that no official public
    API was ever documented and that the product shut down on 2026-01-16. No
    openapi/, rate-limits/, finops/, or collections/ artifacts were fabricated;
    only a plans/ file recording historical subscription pricing was included.
